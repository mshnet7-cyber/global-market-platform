name: Materialize project source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source payload
        id: check
        shell: bash
        run: |
          if test -f .gmp-import/READY; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize source
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gmp
          cat .gmp-import/tar-*.txt | tr -d '\n\r' | base64 -d > /tmp/gmp/project.tar.gz
          tar -xzf /tmp/gmp/project.tar.gz -C .
          rm -rf .gmp-import
          rm -f index.html
      - name: Commit materialized source
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize V0.2.4 source" || exit 0
          git push
