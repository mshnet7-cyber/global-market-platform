name: Materialize project source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check import payload
        id: check
        shell: bash
        run: |
          if compgen -G '.gmp-import/chunk-*' > /dev/null; then
            echo "has_import=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_import=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild source tree
        if: steps.check.outputs.has_import == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gmp-import
          cat .gmp-import/chunk-* | base64 -d > /tmp/gmp-import/project.zip
          rm -rf /tmp/gmp-import/project
          unzip -q /tmp/gmp-import/project.zip -d /tmp/gmp-import/project
          cp -a /tmp/gmp-import/project/global-market-platform/. .
          rm -rf .gmp-import
          rm -f index.html
      - name: Commit materialized source
        if: steps.check.outputs.has_import == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize V0.2.4 source" || exit 0
          git push
