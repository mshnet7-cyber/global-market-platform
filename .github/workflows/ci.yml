name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, stage3-ai-integrations-global, 'stage3-*']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Contract and structural tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
