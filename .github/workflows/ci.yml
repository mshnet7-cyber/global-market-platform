name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, stage3-ai-integrations-global, 'stage3-*', 'cloudflare-workers-*']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Contract and structural tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Cloudflare vinext compatibility check
        if: startsWith(github.head_ref, 'cloudflare-workers-') || startsWith(github.ref, 'refs/heads/cloudflare-workers-')
        run: npm run check:vinext
      - name: Cloudflare Workers production build
        if: startsWith(github.head_ref, 'cloudflare-workers-') || startsWith(github.ref, 'refs/heads/cloudflare-workers-')
        run: npm run build:vinext
      - name: Cloudflare Workers deploy dry-run
        if: startsWith(github.head_ref, 'cloudflare-workers-') || startsWith(github.ref, 'refs/heads/cloudflare-workers-')
        run: npm run deploy:cloudflare:dry-run

  vercel-preview:
    name: Vercel Preview Deploy
    needs: quality
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'cloudflare-workers-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@50.15.1

      - name: Validate Vercel deployment credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing GitHub Actions secret VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Missing GitHub Actions secret VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Missing GitHub Actions secret VERCEL_PROJECT_ID"; exit 1; }

      - name: Link Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          rm -rf .vercel
          vercel link --yes "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      - name: Validate required Vercel Preview environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          env_list="$(vercel env ls preview --token="$VERCEL_TOKEN" | awk '{print $1}')"
          for name in NEXT_PUBLIC_SUPABASE_URL GMP_DEMO_SESSION_SECRET; do
            if ! printf '%s\n' "$env_list" | grep -Fxq "$name"; then
              echo "::error::Missing Vercel Preview environment variable: $name"
              exit 1
            fi
          done
          if ! printf '%s\n' "$env_list" | grep -Fxq "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" && ! printf '%s\n' "$env_list" | grep -Fxq "NEXT_PUBLIC_SUPABASE_ANON_KEY"; then
            echo "::error::Missing Vercel Preview Supabase publishable/anon key"
            exit 1
          fi
          if ! printf '%s\n' "$env_list" | grep -Fxq "SUPABASE_SECRET_KEY" && ! printf '%s\n' "$env_list" | grep -Fxq "SUPABASE_SERVICE_ROLE_KEY"; then
            echo "::error::Missing Vercel Preview server-only Supabase key"
            exit 1
          fi

      - name: Pull final Vercel preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Validate pulled preview environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(grep -E '^NEXT_PUBLIC_SUPABASE_URL=' .env.preview 2>/dev/null | cut -d= -f2-)" || { echo "::error::NEXT_PUBLIC_SUPABASE_URL missing"; exit 1; }
          grep -Eq '^NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=.+$|^NEXT_PUBLIC_SUPABASE_ANON_KEY=.+$' .env.preview 2>/dev/null || { echo "::error::Supabase publishable/anon key missing"; exit 1; }
          grep -Eq '^SUPABASE_SECRET_KEY=.+$|^SUPABASE_SERVICE_ROLE_KEY=.+$' .env.preview 2>/dev/null || { echo "::error::No server-only Supabase key found"; exit 1; }
          test -n "$(grep -E '^GMP_DEMO_SESSION_SECRET=' .env.preview 2>/dev/null | cut -d= -f2-)" || { echo "::error::GMP_DEMO_SESSION_SECRET missing"; exit 1; }

      - name: Build tested Vercel preview artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy tested preview artifact
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --non-interactive --token="$VERCEL_TOKEN" | tail -n 1)"
          test -n "$url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $url"

      - name: Smoke test deployed preview
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          vercel curl /api/health --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN"
          vercel curl /login --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN"
