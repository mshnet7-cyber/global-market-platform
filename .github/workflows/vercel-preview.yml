name: Vercel Preview Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'cloudflare-workers-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@50.15.1

      - name: Ensure required preview environment
        shell: bash
        run: |
          set -euo pipefail

          ensure_env() {
            local name="$1"
            local value="$2"
            if ! vercel env ls preview --token="${{ secrets.VERCEL_TOKEN }}" | awk '{print $1}' | grep -Fxq "$name"; then
              printf '%s' "$value" | vercel env add "$name" preview --sensitive --token="${{ secrets.VERCEL_TOKEN }}"
            fi
          }

          ensure_env NEXT_PUBLIC_SUPABASE_URL "https://jwspwefzpsleovjuifxi.supabase.co"
          ensure_env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "sb_publishable_jWtSwXizl3kJJ9f7x6_KQQ_vXcR9YTw"
          ensure_env GMP_DEMO_SESSION_SECRET "$(openssl rand -hex 32)"

          env_list="$(vercel env ls preview --token="${{ secrets.VERCEL_TOKEN }}" | awk '{print $1}')"
          if ! printf '%s\n' "$env_list" | grep -Fxq "SUPABASE_SECRET_KEY" && ! printf '%s\n' "$env_list" | grep -Fxq "SUPABASE_SERVICE_ROLE_KEY"; then
            echo "::error::Missing required Vercel Preview server-only Supabase key. Add SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY to the Vercel Preview environment before deployment."
            exit 1
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull final Vercel preview environment
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Validate pulled preview environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(grep -E '^NEXT_PUBLIC_SUPABASE_URL=' .env.preview 2>/dev/null | cut -d= -f2-)" || { echo "::error::NEXT_PUBLIC_SUPABASE_URL missing from pulled preview environment"; exit 1; }
          test -n "$(grep -E '^NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=' .env.preview 2>/dev/null | cut -d= -f2-)" || { echo "::error::NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY missing from pulled preview environment"; exit 1; }
          grep -Eq '^SUPABASE_SECRET_KEY=.+$|^SUPABASE_SERVICE_ROLE_KEY=.+$' .env.preview 2>/dev/null || { echo "::error::No server-only Supabase key found in pulled preview environment"; exit 1; }
          test -n "$(grep -E '^GMP_DEMO_SESSION_SECRET=' .env.preview 2>/dev/null | cut -d= -f2-)" || { echo "::error::GMP_DEMO_SESSION_SECRET missing from pulled preview environment"; exit 1; }

      - name: Build Vercel preview artifact
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy tested preview artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --non-interactive --token="${{ secrets.VERCEL_TOKEN }}" | tail -n 1)"
          test -n "$url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke test deployed preview
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          vercel curl /api/health --deployment "$deployment_url" --token="${{ secrets.VERCEL_TOKEN }}"
          vercel curl /login --deployment "$deployment_url" --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
